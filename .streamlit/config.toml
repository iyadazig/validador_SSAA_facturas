# Tema corporativo GE&PE (colores del logo y de la plantilla del informe diario)
[theme]
base = "light"
primaryColor = "#970000"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F1EC"
textColor = "#1E1E1E"
font = "sans serif"

[client]
# sin menu de desarrollador ni boton "Deploy" (textos en ingles)
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
headless = true
